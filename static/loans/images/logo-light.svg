<svg width="220" height="52" viewBox="0 0 220 52" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Logomark container -->
  <rect width="48" height="48" rx="12" fill="#1C1917"/>
  <!-- Coin ring -->
  <circle cx="24" cy="26" r="11" stroke="#F0EDE8" stroke-width="1.8" fill="none"/>
  <!-- Tick marks -->
  <line x1="24" y1="15" x2="24" y2="18" stroke="#F0EDE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="35" y1="26" x2="32" y2="26" stroke="#F0EDE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="37" x2="24" y2="34" stroke="#F0EDE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="13" y1="26" x2="16" y2="26" stroke="#F0EDE8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Currency label -->
  <text x="24" y="30.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" fill="#2D5BE3">KES</text>
  <!-- Blue accent dot -->
  <circle cx="38" cy="14" r="4" fill="#2D5BE3"/>
  <!-- Vertical separator -->
  <line x1="58" y1="8" x2="58" y2="46" stroke="#D6D0C8" stroke-width="1"/>
  <!-- Wordmark — dark text for light backgrounds -->
  <text x="62" y="22" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#1C1917" letter-spacing="-0.4">Loan</text>
  <text x="62" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="400" fill="#78716C" letter-spacing="-0.2" font-style="italic">Manager</text>
</svg>
