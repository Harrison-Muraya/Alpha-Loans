<div class="field {% if field.field.widget.input_type == 'checkbox' %}{% else %}{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
    <label class="check-row" for="{{ field.id_for_label }}">{{ field }} <span>{{ field.label }}</span></label>
    {% else %}
    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% endif %}
    {% if field.help_text %}<p class="hint">{{ field.help_text }}</p>{% endif %}
    {% for error in field.errors %}
    <p class="field-error" role="alert">{{ error }}</p>
    {% endfor %}
</div>
