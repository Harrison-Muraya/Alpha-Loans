{% extends 'loans/base.html' %}
{% load static %}
{% block title %}Sign in — Alpha Loans{% endblock %}
{% block content %}
<section class="card auth-card">
    <div class="auth-mark" aria-hidden="true">
        <img src="{% static 'loans/images/favicon.svg' %}" alt="" width="28" height="28">
    </div>
    <h1>Alpha Loans</h1>
    <p class="lede">Sign in to the loan book.</p>
    <form method="post" action="{% url 'login' %}" style="margin-top:1.1rem;">
        {% csrf_token %}
        <div class="stack">
            <div class="field">
                <label for="username">Username</label>
                <input class="input" type="text" id="username" name="username" autocomplete="username" required placeholder="Username">
            </div>
            <div class="field">
                <div class="page-head" style="margin:0;">
                    <label for="password">Password</label>
                    <a href="{% url 'password_reset' %}">Forgot password?</a>
                </div>
                <input class="input" type="password" id="password" name="password" autocomplete="current-password" required placeholder="Password">
            </div>
            <button type="submit" class="btn btn-primary">Sign in</button>
        </div>
    </form>
    <p class="lede" style="margin-top:1rem;">No account? <a href="{% url 'register' %}">Register as a borrower</a></p>
</section>
{% endblock %}
