# Alpha Loans — reverse proxy (Docker stack + reference for the bare-metal nginx)
upstream alpha_loans { server web:8000; keepalive 32; }

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /static/ {
        alias /srv/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    location = /healthz/ { proxy_pass http://alpha_loans; access_log off; }
    location / {
        proxy_pass http://alpha_loans;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
